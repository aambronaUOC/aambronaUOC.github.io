<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>8BITS — Prototipo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="system-overlay" class="hidden">
        <p id="system-message">SYSTEM: +1 ENGAGEMENT</p>
    </div>
    <div id="modal" class="hidden">
        <div id="modal-content">
            <h2>Optimización de memoria</h2>
            <p>Se purgará un fragmento de memoria. ¿Confirmar proceso?</p>
            <button id="confirm">OPTIMIZAR</button>
            <button id="cancel">CANCELAR</button>
        </div>
    </div>
    <main id="grid">
        <!-- 8 bits -->
        
<div class="bit" data-bit="1">
    <video class="bit-video" src="assets/videos/bit1_on.mp4" autoplay loop muted></video>
    <button class="switch" data-state="on">1</button>
</div>


<div class="bit" data-bit="2">
    <video class="bit-video" src="assets/videos/bit2_on.mp4" autoplay loop muted></video>
    <button class="switch" data-state="on">1</button>
</div>


<div class="bit" data-bit="3">
    <video class="bit-video" src="assets/videos/bit3_on.mp4" autoplay loop muted></video>
    <button class="switch" data-state="on">1</button>
</div>


<div class="bit" data-bit="4">
    <video class="bit-video" src="assets/videos/bit4_on.mp4" autoplay loop muted></video>
    <button class="switch" data-state="on">1</button>
</div>


<div class="bit" data-bit="5">
    <video class="bit-video" src="assets/videos/bit5_on.mp4" autoplay loop muted></video>
    <button class="switch" data-state="on">1</button>
</div>


<div class="bit" data-bit="6">
    <video class="bit-video" src="assets/videos/bit6_on.mp4" autoplay loop muted></video>
    <button class="switch" data-state="on">1</button>
</div>


<div class="bit" data-bit="7">
    <video class="bit-video" src="assets/videos/bit7_on.mp4" autoplay loop muted></video>
    <button class="switch" data-state="on">1</button>
</div>


<div class="bit" data-bit="8">
    <video class="bit-video" src="assets/videos/bit8_on.mp4" autoplay loop muted></video>
    <button class="switch" data-state="on">1</button>
</div>

    </main>
<script src="script.js"></script>
</body>
</html>
